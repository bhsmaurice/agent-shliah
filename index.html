<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Shliah Bot Login</title>
<style>
body {
  background: linear-gradient(160deg, #0B0B14 0%, #1A1233 55%, #2D2166 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
}
.box {
  background: rgba(0,0,0,0.4);
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  color: white;
  width: 90%;
  max-width: 400px;
}
h1 { font-size: 32px; margin-bottom: 5px; color: #B8972A; }
p { color: rgba(255,255,255,0.6); margin: 10px 0 30px; }
input {
  width: 100%;
  padding: 15px;
  font-size: 20px;
  text-align: center;
  border: 2px solid #B8972A;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  color: #B8972A;
  margin-bottom: 20px;
  letter-spacing: 4px;
  font-weight: bold;
}
.buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button {
  padding: 15px;
  font-size: 18px;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.08);
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
button:active { background: #B8972A; color: #0B0B14; }
.msg { margin-top: 15px; font-size: 12px; min-height: 20px; }
</style>
</head>
<body>
<div class="box">
  <h1>🤖 Shliah Bot</h1>
  <p>Panneau d'administration</p>
  
  <input type="text" id="code" placeholder="Tape le code" maxlength="6">
  
  <div class="buttons">
    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="add('0')">0</button>
    <button onclick="del()" style="grid-column: 2;">⌫</button>
  </div>
  
  <div class="msg" id="msg"></div>
</div>

<script>
const CODE = '194561';

function add(d) {
  const inp = document.getElementById('code');
  if (inp.value.length < 6) inp.value += d;
  check();
}

function del() {
  const inp = document.getElementById('code');
  inp.value = inp.value.slice(0, -1);
}

function check() {
  const inp = document.getElementById('code');
  if (inp.value.length === 6) {
    if (inp.value === CODE) {
      document.getElementById('msg').textContent = '✓ OK! Redirection...';
      document.getElementById('msg').style.color = '#51cf66';
      localStorage.setItem('shliah_session', JSON.stringify({
        role: 'admin',
        until: Date.now() + 30*24*60*60*1000
      }));
      setTimeout(() => {
        window.location = 'admin.html';
      }, 1000);
    } else {
      document.getElementById('msg').textContent = '✗ Mauvais code';
      document.getElementById('msg').style.color = '#ff6b6b';
      inp.value = '';
    }
  }
}
</script>
</body>
</html>
