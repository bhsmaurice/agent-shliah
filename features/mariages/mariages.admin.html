<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mariages · Shliah Bot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600&amp;display=swap">
<style>
  :root { color-scheme: light; --ink: #252841; --muted: #575d76; --accent: #5138a0; --line: #ded9ea; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1024px; margin: auto; padding: 30px clamp(16px, 5vw, 48px) 64px; }
  header, .toolbar, .dossier, nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  h1 { margin: 2px 0 10px; font-size: clamp(2rem, 5vw, 3rem); }
  h2 { font-size: 1.35rem; margin: 0 0 14px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  nav { justify-content: flex-start; padding: 12px 0 20px; }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px; background: white; color: var(--accent); font-weight: 640; }
  button.primary, button[aria-selected="true"] { background: var(--accent); color: white; border-color: var(--accent); }
  button:disabled { opacity: .6; cursor: default; }
  :focus-visible { outline: 3px solid #896dde; outline-offset: 2px; }
  fieldset, .dossier, #login { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 0 0 14px; }
  .couple-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .question-skip { display: block; width: fit-content; margin-top: 3px; padding: 2px 6px; font-size: .78rem; border-color: transparent; background: transparent; }
  .question-skip[aria-pressed="true"] { background: #eeebf8; border-color: var(--line); }
  .question-progress { margin: 3px 0 8px; font-weight: 650; color: var(--accent); }
  .wedding-date-block { margin-bottom: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #faf8fd; }
  .wedding-date-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), max-content)); gap: 10px 16px; }
  .wedding-date-controls input, .wedding-date-controls select { min-width: min(100%, 240px); }
  .wedding-date-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px 14px; margin-top: 10px; }
  .wedding-date-results bdi { margin-inline-start: 6px; font-size: 1.18rem; }
  .identity-block { border: 2px solid var(--accent); border-radius: 16px; padding: clamp(10px, 2vw, 18px); }
  .couple-fields.identity-block legend { font-size: clamp(1.25rem, 2.5vw, 1.6rem); font-weight: 800; }
  .identity-block label, .identity-block input { font-size: 1.125rem; font-weight: 750; }
  .identity-block input[dir="rtl"] { font-size: 1.35rem; }
  .identity-block fieldset { margin-bottom: 0; }
  .couple-fields fieldset { min-width: 0; border-color: var(--person-border); background: var(--person-bg); }
  .person-groom { --person-border: #9dbdd8; --person-bg: #f1f7fc; --person-ink: #214e73; }
  .person-bride { --person-border: #d9abc7; --person-bg: #fcf3f9; --person-ink: #78385f; }
  .honorees-fields .fields { grid-template-columns: minmax(0, 1fr); }
  .couple-fields legend { font-size: 1.2rem; color: var(--person-ink); }
  @media (max-width: 720px) { .couple-fields { grid-template-columns: 1fr; gap: 0; } }
  legend { padding: 0 8px; font-weight: 700; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px 18px; }
  .couple-fields .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .couple-fields .fields > :not(.name-part) { grid-column: 1 / -1; }
  .name-part { display: grid; gap: 5px; align-content: start; min-width: 0; }
  .name-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px; }
  .name-toggle { min-width: 34px; padding: 4px 8px; }
  .parent-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .parent-column { display: grid; align-content: start; gap: 10px; min-width: 0; padding: 10px; border: 1px solid var(--person-border); border-radius: 10px; background: #fff; }
  .parent-column h4 { margin: 0; color: var(--person-ink); font-size: 1rem; }
  @media (max-width: 460px) { .parent-columns { grid-template-columns: 1fr; } }
  .parents-heading { margin: 6px 0 0; font-size: 1rem; color: var(--person-ink); }
  #print-sheet .parents-heading { margin: 3mm 0 0; color: inherit; font-size: inherit; }
  .fields label[hidden] { display: none; }
  .form-step > fieldset { padding: 20px; border-top: 3px solid #b6cee5; background: #f7fbff; }
  .form-step > fieldset:nth-of-type(even) { border-top-color: #e1b8d1; background: #fff8fc; }
  .form-step > fieldset legend { color: #473461; background: white; border-radius: 8px; padding: 3px 10px; }
  .section-links button { padding: 5px 9px; border: 1px solid #ded9ea; border-radius: 9px; background: #faf7ff; text-decoration: none; }
  .section-links button:hover { background: #ede7fa; }
  .section-links { justify-content: flex-start; gap: 6px 14px; padding: 12px 0 18px; }
  .section-links button { color: var(--accent); font-size: .9rem; }
  .section-links button[aria-current="step"] { color: white; background: var(--accent); border-color: var(--accent); }
  .step-heading { margin: 0 0 12px; font-size: 1.13rem; }
  .step-navigation { flex: 1 0 100%; }
  #fields fieldset { scroll-margin-top: 12px; }
  .equipment-grid { display: grid; gap: 8px; }
  .equipment-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #faf8fd; }
  .equipment-row:has(input:checked) { background: #f1faf5; border-color: #bfdaca; }
  .equipment-row label.check { gap: 7px; min-height: 44px; }
  .equipment-grid > .full { margin-top: 6px; }
  #dossier-form > .toolbar { position: sticky; bottom: 0; z-index: 1; padding: 12px 0; border-top: 1px solid var(--line); background: #fff; }
  textarea { resize: vertical; }
  @media (max-width: 480px) { .form-step > fieldset { padding: 12px; } }
  label { display: grid; gap: 5px; align-content: start; font-weight: 550; }
  label.check { display: flex; align-items: center; align-self: end; min-height: 44px; margin-bottom: 1px; }
  label.check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .witness-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .witness-fields > fieldset { min-width: 0; background: #f7fbff; }
  .witness-fields > fieldset + fieldset { background: #fff8fc; }
  @media (max-width: 580px) { .witness-fields { grid-template-columns: 1fr; gap: 0; } }
  .full { grid-column: 1 / -1; }
  input, select, textarea { min-width: 0; width: 100%; color: var(--ink); padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  [lang="he"] { font-family: "Frank Ruhl Libre", "Times New Roman", serif; font-weight: 600; }
  .identity-block input[lang="he"] { font-weight: 600; }
  input[dir="rtl"] { font-size: 1.18em; }
  .hebrew-field { display: grid; gap: 5px; align-content: start; min-width: 0; }
  .hebrew-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px; }
  .hebrew-keyboard { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .hebrew-keyboard[hidden] { display: none; }
  .hebrew-keyboard button, .hebrew-toggle { min-width: 36px; min-height: 36px; padding: 4px 7px; }
  .hebrew-keyboard button[lang="he"] { font-size: 1.18em; }
  #login { max-width: 440px; }
  #list-panel .toolbar { align-items: end; margin-bottom: 18px; }
  #list-panel label { min-width: min(100%, 240px); }
  #feedback:empty { display: none; }
  #feedback { padding: 8px 12px; background: #f3effa; border-radius: 8px; }
  #print-sheet { display: none; }
  .city-suggestion { margin-top: 5px; padding: 5px 10px; justify-self: start; }
  .ketouba-summary { margin-bottom: 14px; }
  .ketouba-summary dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px 18px; margin: 0; }
  .ketouba-summary dt { font-weight: 650; }
  .ketouba-summary dd { margin: 0; overflow-wrap: anywhere; }
  .ketouba-summary dd button { margin-inline-start: 8px; padding: 2px 8px; font-size: .875rem; }
  #return-admin { color: var(--accent); font-size: .9rem; font-weight: 650; }
  #open-wide { margin-bottom: 12px; }
  .wide-view main { max-width: 1260px; padding-top: 22px; }
  .wide-view h1 { font-size: clamp(2rem, 4vw, 2.5rem); }
  .wide-view .identity-block label { font-size: 1.075rem; }
  .wide-view .fields input, .wide-view .fields textarea, .wide-view .fields select { padding: 9px; }
  .wide-view .section-links { gap: 8px; padding: 8px 0 16px; }
  .wide-view .section-links button { padding: 9px 12px; }
  @media print {
    @page { margin: 14mm; }
    @page marriage-blank { size: A4 portrait; margin: 11mm 13mm; }
    main { display: none; }
    #print-sheet { display: block; font-size: 11pt; }
    #print-sheet h1 { font-size: 22pt; }
    #print-sheet h2 { margin: 14px 0 5px; break-after: avoid; }
    #print-sheet p { white-space: pre-wrap; overflow-wrap: anywhere; }
    #print-sheet [lang="he"] { font-size: 16pt; }
    #print-sheet.blank-print { font-size: 9.5pt; line-height: 1.22; }
    .paper-page { page: marriage-blank; break-after: page; }
    .paper-page:last-child { break-after: auto; }
    .paper-page > header { border-bottom: 1px solid #252841; padding-bottom: 2mm; }
    .paper-witnesses { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
    .paper-witnesses section { border: 1px solid #b9c7d6; padding: 1mm 2mm; break-inside: avoid; }
    .paper-witnesses .paper-columns { grid-template-columns: 1fr; }
    .paper-brand { text-align: center; width: 100%; font-size: 8.5pt; color: #313144; }
    .paper-brand img { display: block; width: 22mm; height: auto; margin: 0 auto 1mm; }
    .paper-brand strong { display: block; font-size: 13pt; margin-bottom: 1mm; }
    .paper-page > header:has(.paper-brand) { justify-content: center; border-bottom-color: #b78a2d; row-gap: 2mm; }
    #print-sheet .paper-page h1 { font-size: 16pt; margin: 0; }
    #print-sheet .paper-page h2 { font-size: 11pt; margin: 3mm 0 1mm; }
    .paper-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2mm 7mm; }
    .paper-field { min-width: 0; break-inside: avoid; }
    .paper-line { display: block; height: 5mm; border-bottom: 1px solid #666; }
    .paper-equipment { display: grid; grid-template-columns: 1fr auto; gap: 1mm 7mm; align-items: end; }
    .paper-check { white-space: nowrap; padding-bottom: 0.6mm; }
    .paper-box { display: inline-block; width: 3.4mm; height: 3.4mm; border: 1px solid #222; vertical-align: middle; margin-right: 1.5mm; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div><p class="muted">Shliah Bot · Beth Habad S Maurice</p><h1>Mariages</h1></div>
    <a id="return-admin" href="https://bhsmaurice.github.io/agent-shliah/admin.html" hidden>← Retour à l’admin</a>
    <button id="logout" type="button" hidden>Se déconnecter</button>
  </header>
  <p id="feedback" role="status" aria-live="polite"></p>
  <form id="login">
    <label>Mot de passe administrateur <input id="password" type="password" autocomplete="current-password" required></label>
    <p></p><button class="primary">Se connecter</button>
  </form>
  <div id="workspace" hidden>
    <nav aria-label="Mariages" role="tablist">
      <button id="form-tab" type="button" role="tab" aria-controls="form-panel" aria-selected="true">Premier rendez-vous</button>
      <button id="list-tab" type="button" role="tab" aria-controls="list-panel" aria-selected="false" tabindex="-1">Mariages à venir</button>
    </nav>
    <button id="open-wide" type="button">Ouvrir en grand ↗</button>
    <section id="form-panel" role="tabpanel" aria-labelledby="form-tab">
      <div class="toolbar"><h2 id="form-title">Nouveau dossier</h2><button type="button" id="new-form" hidden>Nouveau dossier</button></div>
      <p id="question-progress" class="question-progress"></p>
      <form id="dossier-form">
        <p class="muted">Tu peux enregistrer un brouillon à tout moment et le retrouver dans la liste des dossiers.</p>
        <nav id="section-links" class="section-links" aria-label="Étapes du dossier"></nav>
        <div id="fields"></div>
        <div class="toolbar">
          <div class="toolbar step-navigation">
            <button type="button" id="previous-step">Précédent</button>
            <span id="step-progress" class="muted" aria-live="polite"></span>
            <button type="button" id="next-step">Suivant</button>
          </div>
          <button class="primary" id="save">Enregistrer le dossier</button>
          <button id="save-draft" type="submit">Enregistrer comme brouillon</button>
          <button type="button" id="pdf">Imprimer / Enregistrer en PDF</button>
          <button type="button" id="blank-pdf">Imprimer le formulaire vierge</button>
        </div>
      </form>
    </section>
    <section id="list-panel" role="tabpanel" aria-labelledby="list-tab" hidden>
      <div class="toolbar">
        <label>Rechercher un couple <input id="search" type="search" placeholder="Nom, prénom ou lieu"></label>
        <label>Afficher <select id="filter"><option value="upcoming">Mariages à venir</option><option value="drafts">Brouillons</option><option value="all">Tous les dossiers</option></select></label>
        <button type="button" id="refresh">Actualiser</button>
        <button type="button" id="new-list" class="primary">Nouveau dossier</button>
      </div>
      <div id="dossiers"></div>
    </section>
  </div>
</main>
<article id="print-sheet" aria-label="Dossier de mariage"></article>
<script>
'use strict';
const get = id => document.getElementById(id);
const form = get('dossier-form');
const login = get('login');
const wideView = new URLSearchParams(location.search).get('vue') === 'large';
const launch = new URLSearchParams(location.hash.slice(1));
if (wideView) {
  document.body.classList.add('wide-view');
  get('open-wide').hidden = true;
  get('return-admin').hidden = false;
  if (location.hostname === 'bhsmaurice.github.io') get('return-admin').href = new URL('../../admin.html', location.href);
}

get('open-wide').onclick = () => {
  if (dirty) {
    feedback('Enregistre tes modifications ou ton brouillon avant d’ouvrir la vue grand format.');
    get('feedback').scrollIntoView({ block: 'nearest' });
    return;
  }
  const url = new URL(location.href);
  url.searchParams.set('vue', 'large');
  const selection = new URLSearchParams({ etape: String(activeStep) });
  if (!get('list-panel').hidden) {
    selection.set('liste', get('filter').value);
  } else if (current?.revision) {
    selection.set('dossier', current.id);
  }
  url.hash = selection.toString();
  window.open(url.href, '_blank', 'noopener');
};
const endpoint = location.origin === 'https://bhsmaurice.github.io'
  ? 'https://agent-shliah-production.up.railway.app/admin/mariages'
  : '/admin/mariages';
let password = '';
let schema = [];
let dossiers = [];
let current;
let dirty = false;
let busy = false;
let activeStep = 0;
const formSteps = [
  [null, 'Identité des futurs mariés'],
  ['ketoubaWeekday', 'Ketouba'],
  ['meetingDate', 'Rendez-vous et familles'],
  ['civilDate', 'Mariage et organisation'],
  ['groomGrandmothers', 'Proches et cérémonie'],
  ['cupsOwner', 'Matériel'],
  ['identity', 'Documents et suivi']
];
const initial = { status: 'À compléter' };

function create(tag, content) {
  const element = document.createElement(tag);
  if (content) element.textContent = content;
  return element;
}

function feedback(message = '') {
  get('feedback').textContent = message;
}

function setBusy(value) {
  busy = value;
  for (const id of ['save', 'save-draft', 'logout', 'refresh', 'new-form', 'new-list', 'pdf', 'blank-pdf']) get(id).disabled = value;
  for (const fieldset of get('fields').children) fieldset.disabled = value;
}

async function request(path, options = {}) {
  const response = await fetch(endpoint + path, {
    ...options,
    headers: { 'X-Admin-Password': password, ...(options.headers || {}) }
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Le serveur est indisponible.');
  return data;
}

function arrangeSections(sections) {
  const people = [
    { key: 'groom', title: '‘Hatan — Futur marié', name: 'groomName', escorts: 'groomEscorts' },
    { key: 'bride', title: 'Kallah — Future mariée', name: 'brideName', escorts: 'brideEscorts' }
  ];
  const allFields = sections.flatMap(([, fields]) => fields);
  const honorKeys = ['Grandmothers', 'Grandfathers', 'OtherHonorees', 'MemorialNames'];
  const ceremonyGroups = [
    ['Cortège et organisation', ['arrivalTime', 'processionTime', 'processionOrder', 'ceremonyCoordinator', 'yichudPlan']],
    ['Sonorisation', ['soundPhone', 'musicType', 'musicContact', 'musicTracks', 'musicSetup']],
    ['Proches et hommages du ‘Hatan', honorKeys.map(key => 'groom' + key), 'groom-honors'],
    ['Proches et hommages de la Kallah', honorKeys.map(key => 'bride' + key), 'bride-honors'],
    ['Annonces sous la ‘houppa', ['announcementLead', 'grandmothers', 'grandfathers', 'otherHonorees', 'memorialNames']],
    ['Rôles sous la ‘houppa', ['tallitHolders', 'ketubahReader', 'firstBlessings', 'chuppahBlessing']],
    ['Chéva Berakhot', ['sheva1', 'sheva2', 'sheva3', 'sheva4', 'sheva5', 'sheva6', 'sheva7', 'shevaOrder']]
  ];
  return sections.flatMap(([title, fields]) => {
    if (title === 'Témoins') {
      return ['One', 'Two'].map((number, index) => [
        'Témoin ' + (index + 1),
        fields.filter(([key]) => key.startsWith('witness' + number)).map(([key, label, type]) => [
          key, label.replace(/^Témoin [12] : /, '').replace(/^./, char => char.toUpperCase()), type
        ]),
        'witness'
      ]);
    }
    const person = people.find(item => fields.some(([key]) => key === item.name));
    if (person) {
      const escortField = allFields.find(([key]) => key === person.escorts);
      return [[person.title, escortField ? [...fields, escortField] : fields, person.key]];
    }
    if (fields.some(([key]) => key === 'sheva1')) {
      const grouped = ceremonyGroups.map(([name, keys, person]) => [name, keys.flatMap(key => fields.filter(([id]) => id === key)), person]);
      const other = fields.filter(([key]) => !people.some(person => person.escorts === key) && !ceremonyGroups.some(([, keys]) => keys.includes(key)));
      return other.length ? [...grouped, [title, other]] : grouped;
    }
    return [[title, fields]];
  });
}

function parentsHeading(person, key) {
  if (!person || key !== person + 'Parents') return;
  const heading = create('h3', person === 'groom' ? 'Parents du ‘Hatan' : 'Parents de la Kallah');
  heading.className = 'parents-heading full';
  return heading;
}

function hebrewNumber(number) {
  let letters = '';
  for (const [value, letter] of [[400, 'ת'], [300, 'ש'], [200, 'ר'], [100, 'ק'], [90, 'צ'], [80, 'פ'], [70, 'ע'], [60, 'ס'], [50, 'נ'], [40, 'מ'], [30, 'ל'], [20, 'כ'], [10, 'י'], [9, 'ט'], [8, 'ח'], [7, 'ז'], [6, 'ו'], [5, 'ה'], [4, 'ד'], [3, 'ג'], [2, 'ב'], [1, 'א']]) {
    while (number >= value) {
      if (number === 15 || number === 16) {
        letters += number === 15 ? 'טו' : 'טז';
        number = 0;
        break;
      }
      letters += letter;
      number -= value;
    }
  }
  return letters.length === 1 ? letters + '׳' : letters.slice(0, -1) + '״' + letters.slice(-1);
}

const hebrewDateOptions = {
  ketoubaWeekday: [
    ['Dimanche', 'ראשון'], ['Lundi', 'שני'], ['Mardi', 'שלישי'], ['Mercredi', 'רביעי'],
    ['Jeudi', 'חמישי'], ['Vendredi', 'שישי'], ['Chabbat', 'שבת']
  ],
  ketoubaDay: Array.from({ length: 30 }, (_, index) => [String(index + 1), hebrewNumber(index + 1)]),
  ketoubaMonth: [
    ['Tichri', 'תשרי'], ['‘Hechvan', 'חשוון'], ['Kislev', 'כסלו'], ['Tévet', 'טבת'],
    ['Chevat', 'שבט'], ['Adar', 'אדר'], ['Adar I', 'אדר א׳'], ['Adar II', 'אדר ב׳'],
    ['Nissan', 'ניסן'], ['Iyar', 'אייר'], ['Sivan', 'סיוון'], ['Tamouz', 'תמוז'],
    ['Av', 'אב'], ['Eloul', 'אלול']
  ],
  ketoubaYear: Array.from({ length: 101 }, (_, index) => {
    const year = 5750 + index;
    return [String(year), 'ה׳' + hebrewNumber(year % 1000)];
  })
};

const ketoubaCities = [
  ['S Maurice', 'סן מוריס', 'Saint-Maurice'],
  ['Charenton-le-Pont', 'שרנטון לה פון', 'Charenton'],
  ['Maisons-Alfort', 'מזון אלפור'],
  ['Paris', 'פריז'],
  ['Vincennes', 'ונסן'],
  ['Saint-Mandé', 'סן מנדה'],
  ['Joinville-le-Pont', 'ז׳ואנוויל לה פון', 'Joinville'],
  ['Créteil', 'קרטיי'],
  ['Nogent-sur-Marne', 'נוז׳אן סיר מארן'],
  ['Montreuil', 'מונטריי'],
  ['Boulogne-Billancourt', 'בולון בילנקור', 'Boulogne'],
  ['Neuilly-sur-Seine', 'נויי סיר סן', 'Neuilly'],
  ['Sarcelles', 'סרסל'],
  ['Versailles', 'ורסאי'],
  ['Lyon', 'ליון'],
  ['Marseille', 'מרסיי'],
  ['Strasbourg', 'שטרסבורג'],
  ['Nice', 'ניס'],
  ['Toulouse', 'טולוז'],
  ['Bordeaux', 'בורדו'],
  ['Lille', 'ליל'],
  ['Nantes', 'נאנט'],
  ['Jérusalem', 'ירושלים'],
  ['Tel-Aviv', 'תל אביב'],
  ['Netanya', 'נתניה'],
  ['Haïfa', 'חיפה']
];

function cityKey(value) {
  return value.normalize('NFD').replace(/\p{Mark}/gu, '').toLowerCase().replace(/[^a-z]/g, '');
}

function addCitySuggestion(input, label) {
  const options = create('datalist');
  options.id = 'ketouba-city-options';
  const cities = new Map();
  for (const [name, hebrew, ...aliases] of ketoubaCities) {
    options.append(new Option(name, name));
    for (const spelling of [name, ...aliases]) cities.set(cityKey(spelling), hebrew);
  }
  input.setAttribute('list', options.id);
  const suggestion = create('button');
  suggestion.type = 'button';
  suggestion.className = 'city-suggestion';
  const spelling = create('bdi');
  spelling.lang = 'he';
  suggestion.append('Utiliser ', spelling);
  function update() {
    spelling.textContent = cities.get(cityKey(input.value)) || '';
    suggestion.hidden = !spelling.textContent;
  }
  input.addEventListener('input', update);
  suggestion.onclick = () => {
    const target = form.elements.namedItem('ketoubaCity');
    target.value = spelling.textContent;
    target.dispatchEvent(new Event('input', { bubbles: true }));
    target.focus();
  };
  const wrapper = create('div');
  wrapper.append(label, options, suggestion);
  input.refreshCitySuggestion = update;
  update();
  return wrapper;
}

function hebrewField(label, input) {
  const field = create('div');
  field.className = 'hebrew-field';
  const entry = create('div');
  entry.className = 'hebrew-entry';
  input.id = 'field-' + input.name;
  input.dir = 'rtl';
  input.lang = 'he';
  label.htmlFor = input.id;
  input.addEventListener('input', () => {
    const value = input.value.trim();
    const hebrewOnly = /^[\p{Script=Hebrew}\s'".’״׳־-]+$/u;
    input.setCustomValidity(!value || hebrewOnly.test(value) ? '' : 'Utilise uniquement des lettres hébraïques dans ce champ.');
  });

  const toggle = create('button', '⌨');
  toggle.className = 'hebrew-toggle';
  toggle.type = 'button';
  toggle.title = 'Clavier hébreu';
  toggle.setAttribute('aria-label', 'Clavier hébreu — ' + label.textContent);
  const keyboard = create('div');
  keyboard.className = 'hebrew-keyboard';
  keyboard.id = 'keyboard-' + input.name;
  keyboard.dir = 'rtl';
  toggle.setAttribute('aria-controls', keyboard.id);

  function setOpen(open) {
    keyboard.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
  }
  setOpen(false);
  toggle.onclick = () => {
    const open = keyboard.hidden;
    const previous = form.querySelector('.hebrew-toggle[aria-expanded="true"]');
    if (previous && previous !== toggle) previous.click();
    setOpen(open);
  };

  const letters = [...'אבגדהוזחטיכלמנסעפצקרשתךםןףץ'];
  for (const [caption, character] of [...letters.map(letter => [letter, letter]), ['Espace', ' '], ['Effacer', '']]) {
    const key = create('button', caption);
    key.type = 'button';
    if (letters.includes(character)) key.lang = 'he';
    key.onclick = () => {
      let start = input.selectionStart;
      const end = input.selectionEnd;
      if (!character && start === end) start = Math.max(0, start - 1);
      if (input.value.length - (end - start) + character.length > input.maxLength) return;
      const original = input.value;
      input.setRangeText(character, start, end, 'end');
      if (input.value !== original) input.dispatchEvent(new Event('input', { bubbles: true }));
    };
    keyboard.append(key);
  }
  field.onkeydown = event => {
    if (event.key === 'Escape' && !keyboard.hidden) {
      setOpen(false);
      toggle.focus();
    }
  };
  entry.append(input, toggle);
  field.append(label);
  const dateOptions = hebrewDateOptions[input.name];
  if (dateOptions) {
    const select = create('select');
    select.setAttribute('aria-label', 'Choisir — ' + label.textContent);
    select.lang = 'he';
    select.dir = 'rtl';
    select.add(new Option('בחרו מהרשימה…', ''));
    if (input.name === 'ketoubaYear') {
      const parts = new Intl.DateTimeFormat('en-u-ca-hebrew', { year: 'numeric', timeZone: 'Europe/Paris' }).formatToParts(new Date());
      const currentYear = Number(parts.find(part => part.type === 'year')?.value);
      const currentOption = dateOptions.find(([year]) => Number(year) === currentYear);
      if (currentOption) select.add(new Option(currentOption[1] + ' (השנה הנוכחית)', currentOption[1]));
    }
    for (const [, value] of dateOptions) select.add(new Option(value, value));
    select.onchange = () => {
      if (select.value && input.value !== select.value) {
        input.value = select.value;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      select.selectedIndex = 0;
    };
    field.append(select);
  }
  field.append(entry, keyboard);
  return field;
}

function nameField(label, input, extraLabelText) {
  const field = create('div');
  field.className = 'name-part';
  input.id = 'field-' + input.name;
  label.htmlFor = input.id;
  const entry = create('div');
  entry.className = 'name-entry';
  const extraLabel = create('label', extraLabelText);
  extraLabel.id = input.id + '-extra';
  extraLabel.hidden = true;
  const extra = create('input');
  extra.name = input.name + 'Extra';
  extra.maxLength = input.maxLength;
  extraLabel.append(extra);

  const toggle = create('button', '+');
  toggle.type = 'button';
  toggle.className = 'name-toggle';
  toggle.title = 'Ajouter — ' + extraLabelText;
  toggle.setAttribute('aria-label', toggle.title);
  toggle.setAttribute('aria-controls', extraLabel.id);
  toggle.setAttribute('aria-expanded', 'false');
  toggle.onclick = () => {
    extraLabel.hidden = !extraLabel.hidden;
    toggle.setAttribute('aria-expanded', String(!extraLabel.hidden));
    if (!extraLabel.hidden) extra.focus();
  };
  entry.append(input, toggle);
  field.append(label, entry, extraLabel);
  return field;
}

const weddingHebrewDateFormat = new Intl.DateTimeFormat('he-IL-u-ca-hebrew-nu-latn', {
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC'
});

function weddingHebrewDates(value) {
  const date = new Date(value + 'T12:00:00Z');
  if (!value || !Number.isFinite(+date)) return [];
  function format(day) {
    const parts = Object.fromEntries(weddingHebrewDateFormat.formatToParts(day).map(({ type, value }) => [type, value]));
    return parts.weekday + ' · ' + hebrewNumber(Number(parts.day)) + ' ' + parts.month + ' ה׳' + hebrewNumber(Number(parts.year) % 1000);
  }
  return [format(date), format(new Date(+date + 86_400_000))];
}

function weddingDateField(label, input) {
  const block = create('div');
  block.className = 'wedding-date-block';
  const results = create('div');
  results.className = 'wedding-date-results';
  results.id = 'wedding-date-results';
  results.setAttribute('aria-live', 'polite');
  input.setAttribute('aria-describedby', results.id);
  input.addEventListener('input', refreshWeddingHebrewDate);
  const controls = create('div');
  controls.className = 'wedding-date-controls';
  controls.id = 'wedding-date-controls';
  controls.append(label);
  block.append(controls, results);
  return block;
}

function refreshWeddingHebrewDate() {
  const results = get('wedding-date-results');
  if (!results) return;
  const dates = weddingHebrewDates(form.elements.namedItem('weddingDate').value);
  const period = form.elements.namedItem('weddingDayPeriod')?.value;
  results.replaceChildren();
  results.hidden = !dates.length;
  if (!dates.length) return;
  if (!period) {
    results.textContent = 'Choisis le moment de la ‘houppa pour afficher la date hébraïque.';
    return;
  }
  const line = create('div', 'Date hébraïque');
  const date = create('bdi', dates[period === 'En journée' ? 0 : 1]);
  date.lang = 'he';
  date.dir = 'rtl';
  line.append(date);
  results.append(line);
}

function showStep(index, moveFocus = false) {
  activeStep = index;
  formSteps.forEach(([, , page, button], position) => {
    page.hidden = position !== index;
    if (position === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  get('previous-step').disabled = index === 0;
  get('next-step').disabled = index === formSteps.length - 1;
  get('step-progress').textContent = 'Étape ' + (index + 1) + ' sur ' + formSteps.length;
  if (formSteps[index][0] === 'ketoubaWeekday') refreshKetoubaSummary();
  if (moveFocus) formSteps[index][2].firstElementChild.focus();
}

const questionControls = new Map();
let skippedQuestions = new Set();

function questionField(element, control, title, type) {
  if (control.name === 'status' || ['checkbox', 'legacy', 'legacy-textarea'].includes(type)) return element;
  const button = create('button', 'Pas de réponse attendue');
  button.type = 'button';
  button.className = 'question-skip';
  button.setAttribute('aria-label', 'Pas de réponse attendue — ' + title);
  button.setAttribute('aria-pressed', 'false');
  button.onclick = () => {
    if (skippedQuestions.has(control.name)) skippedQuestions.delete(control.name);
    else skippedQuestions.add(control.name);
    dirty = true;
    refreshQuestionProgress();
  };
  questionControls.set(control.name, { control, button, type });
  if (element.tagName === 'LABEL') {
    const wrapper = create('div');
    wrapper.className = element.className;
    wrapper.append(element, button);
    return wrapper;
  }
  element.append(button);
  return element;
}

function questionProgress(answers) {
  const skipped = new Set(answers.skippedQuestions);
  let total = 0;
  let remaining = 0;
  for (const [key, { type }] of questionControls) {
    const value = answers[key]?.trim();
    if (skipped.has(key) || (type === 'document' && value === 'Sans objet')) continue;
    total++;
    if (!value || (type === 'document' && ['À demander', 'Demandé'].includes(value))) remaining++;
  }
  const percent = total ? Math.floor(100 * (total - remaining) / total) : 100;
  const pending = remaining === 1 ? '1 question restante' : remaining + ' questions restantes';
  return percent + ' % complété · ' + pending;
}

function readQuestionAnswers() {
  const answers = Object.fromEntries(new FormData(form));
  answers.skippedQuestions = [...skippedQuestions];
  return answers;
}

function refreshQuestionProgress() {
  for (const [key, { control, button }] of questionControls) {
    const skipped = skippedQuestions.has(key);
    button.hidden = Boolean(control.value.trim());
    button.setAttribute('aria-pressed', String(skipped));
    button.textContent = skipped ? '✓ Pas de réponse attendue' : 'Pas de réponse attendue';
  }
  get('question-progress').textContent = questionProgress(readQuestionAnswers());
}

function buildFields(documentStatuses) {
  const container = get('fields');
  for (const [index, step] of formSteps.entries()) {
    const [, title] = step;
    const page = create('section');
    page.className = 'form-step';
    page.id = 'form-step-' + index;
    const heading = create('h3', title);
    heading.className = 'step-heading';
    heading.tabIndex = -1;
    page.append(heading);
    container.append(page);
    const button = create('button', title);
    button.type = 'button';
    button.setAttribute('aria-controls', page.id);
    button.onclick = () => showStep(index, true);
    get('section-links').append(button);
    step.push(page, button);
  }
  let page = formSteps[0][2];
  const identityBlock = create('div');
  identityBlock.className = 'identity-block couple-fields';
  page.append(identityBlock);
  const coupleFields = create('div');
  coupleFields.className = 'couple-fields';
  const honoreesFields = create('div');
  honoreesFields.className = 'couple-fields honorees-fields';
  const witnessFields = create('div');
  witnessFields.className = 'witness-fields';
  const isCouple = person => person === 'groom' || person === 'bride';
  const isIdentity = (key, person) => ['GivenNames', 'GivenNamesExtra', 'FamilyName', 'FamilyNameExtra', 'Name', 'Hebrew']
    .some(suffix => key === person + suffix);
  const identitySections = schema.filter(([, , person]) => isCouple(person)).map(([title, fields, person]) =>
    [title, fields.filter(([key]) => isIdentity(key, person)), person, true]);
  const otherSections = schema.map(([title, fields, person]) => isCouple(person)
    ? [title, fields.filter(([key]) => !isIdentity(key, person)), person]
    : [title, fields, person]);
  for (const [title, fields, person, identity] of [...identitySections, ...otherSections]) {
    const step = formSteps.find(([key]) => key === fields[0]?.[0]);
    if (step) page = step[2];
    const fieldset = create('fieldset');
    const grid = create('div');
    const equipment = fields.some(([key]) => key === 'cupsOwner');
    const rows = new Map();
    grid.className = equipment ? 'equipment-grid' : 'fields';
    const parentColumns = new Map();
    if (!identity && isCouple(person)) {
      for (const [role, title] of [['Father', 'Père'], ['Mother', 'Mère']]) {
        const column = create('section');
        column.className = 'parent-column';
        column.append(create('h4', title));
        parentColumns.set(role, column);
      }
    }
    for (const [key, fieldTitle, type] of fields) {
      if (type === 'name-extra') continue;
      if (typeof type === 'string' && type.startsWith('archived')) {
        const control = create(type === 'archived-textarea' ? 'textarea' : 'input');
        if (type === 'archived') control.type = 'hidden';
        control.name = key;
        control.hidden = true;
        grid.append(control);
        continue;
      }
      const heading = parentsHeading(person, key);
      if (heading) grid.append(heading);
      const parent = [...parentColumns.keys()].find(role => key.startsWith(person + role));
      if (parent && !parentColumns.get(parent).isConnected && !parentColumns.get(parent).parentElement) {
        const columns = create('div');
        columns.className = 'parent-columns';
        columns.append(...parentColumns.values());
        grid.append(columns);
      }
      const fieldContainer = parentColumns.get(parent) || grid;
      const item = equipment && key.match(/^(.+?)(Owner|Ready)$/);
      const labelText = item?.[2] === 'Owner' ? fieldTitle.split(' — ')[0]
        : item?.[2] === 'Ready' ? 'Prêt' : fieldTitle.replace(/^Chéva Berakhot — (bénédiction \d+), nom de la personne$/, (_, blessing) => blessing[0].toUpperCase() + blessing.slice(1));
      const label = create('label', labelText);
      let control;
      if (Array.isArray(type) || type === 'document') {
        control = create('select');
        if (type === 'document') control.add(new Option('À renseigner', ''));
        for (const value of type === 'document' ? documentStatuses : type) {
          control.add(new Option(key === 'weddingDayPeriod' && !value ? 'Choisir jour ou nuit…' : value, value));
        }
      } else if (type === 'checkbox') {
        control = create('input');
        control.type = 'checkbox';
        control.value = 'Oui';
        label.className = 'check';
        label.prepend(control);
      } else if (type === 'textarea' || type === 'legacy-textarea') {
        label.className = 'full';
        control = create('textarea');
        control.rows = 2;
        control.maxLength = 4000;
      } else {
        control = create('input');
        control.type = ['hebrew', 'name-part', 'legacy'].includes(type) ? 'text' : type || 'text';
        control.maxLength = 240;
      }
      if (type === 'legacy' || type === 'legacy-textarea') label.hidden = true;
      control.name = key;
      if (type === 'name-part') {
        const extraField = fields.find(([name]) => name === key + 'Extra');
        if (extraField) {
          fieldContainer.append(questionField(nameField(label, control, extraField[1]), control, fieldTitle, type));
          continue;
        }
      }
      if (type === 'hebrew') {
        fieldContainer.append(questionField(hebrewField(label, control), control, fieldTitle, type));
        continue;
      }
      if (type !== 'checkbox') label.append(control);
      if (key === 'weddingDate') {
        label.firstChild.textContent = 'Date de la ‘houppa';
        identityBlock.before(weddingDateField(questionField(label, control, fieldTitle, type), control));
        continue;
      }
      if (key === 'weddingDayPeriod') {
        control.setAttribute('aria-describedby', 'wedding-date-results');
        control.addEventListener('change', refreshWeddingHebrewDate);
        get('wedding-date-controls').append(questionField(label, control, fieldTitle, type));
        continue;
      }
      if (key === 'ketoubaCityFrench') {
        grid.append(questionField(addCitySuggestion(control, label), control, fieldTitle, type));
        continue;
      }
      if (item) {
        let row = rows.get(item[1]);
        if (!row) {
          row = create('div');
          row.className = 'equipment-row';
          rows.set(item[1], row);
          grid.append(row);
        }
        if (item[2] === 'Owner') {
          control.placeholder = 'Qui l’apporte ?';
          control.setAttribute('aria-label', fieldTitle);
        } else {
          control.setAttribute('aria-label', fieldTitle);
        }
        row.append(questionField(label, control, fieldTitle, type));
      } else {
        grid.append(questionField(label, control, fieldTitle, type));
      }
    }
    fieldset.append(create('legend', title), grid);
    if (person === 'witness') {
      if (!witnessFields.isConnected) page.append(witnessFields);
      witnessFields.append(fieldset);
    } else if (person?.endsWith('-honors')) {
      if (!honoreesFields.isConnected) page.append(honoreesFields);
      fieldset.classList.add('person-' + person.split('-')[0]);
      honoreesFields.append(fieldset);
    } else if (person) {
      const group = identity ? identityBlock : coupleFields;
      if (!group.isConnected) page.append(group);
      fieldset.classList.add('person-' + person);
      group.append(fieldset);
    } else {
      page.append(fieldset);
      if (fields[0]?.[0] === 'ketoubaWeekday') {
        const recap = create('fieldset');
        recap.className = 'ketouba-summary';
        const summary = create('dl');
        summary.id = 'ketouba-summary';
        recap.append(create('legend', 'Mariés et témoins'), summary);
        page.append(recap, create('p', 'La ketouba prévoit les signatures des deux témoins et du ‘Hatan.'));
      }
    }
  }
}

function couple(answers) {
  return ['groom', 'bride'].map(person => {
    const name = [answers[person + 'GivenNames'], answers[person + 'FamilyName']]
      .map(part => part?.trim()).filter(Boolean).join(' ');
    return name || answers[person + 'Name']?.trim();
  }).filter(Boolean).join(' et ');
}

function showTab(name) {
  for (const tab of ['form', 'list']) {
    get(tab + '-tab').setAttribute('aria-selected', String(tab === name));
    get(tab + '-tab').tabIndex = tab === name ? 0 : -1;
    get(tab + '-panel').hidden = tab !== name;
  }
}

function openDossier(dossier, step = 0) {
  current = dossier || { id: crypto.randomUUID(), revision: 0, answers: initial };
  const priorSoundNumbers = (current.answers.musicContact?.match(/[+\d][\d ().-]*\d/g) || [])
    .filter(number => /^\d{9,15}$/.test(number.replace(/\D/g, '')));
  const priorSoundPhone = priorSoundNumbers.length === 1 ? priorSoundNumbers[0] : '';
  for (const [, fields] of schema) {
    for (const [key, , type] of fields) {
      const control = form.elements.namedItem(key);
      if (type === 'checkbox') control.checked = current.answers[key] === 'Oui';
      else control.value = current.answers[key] ?? (key === 'soundPhone' ? priorSoundPhone : initial[key] ?? '');
      if (type === 'hebrew') control.setCustomValidity('');
      if (key === 'ketoubaCityFrench') control.refreshCitySuggestion();
      if (type === 'legacy' || type === 'legacy-textarea') control.closest('label').hidden = !control.value;
      if (type === 'name-extra') {
        control.closest('label').hidden = !control.value;
        control.closest('.name-part').querySelector('.name-toggle').setAttribute('aria-expanded', String(Boolean(control.value)));
      }
    }
  }
  skippedQuestions = new Set(current.answers.skippedQuestions);
  refreshQuestionProgress();
  refreshWeddingHebrewDate();
  get('form-title').textContent = couple(current.answers) || (current.answers.status === 'Brouillon' ? 'Brouillon sans nom' : 'Nouveau dossier');
  get('new-form').hidden = !current.revision;
  dirty = false;
  showTab('form');
  showStep(step);
  feedback();
}

function switchDossier(dossier) {
  if (busy || (dirty && !window.confirm('Abandonner les modifications non enregistrées ?'))) return;
  openDossier(dossier);
  get('form-tab').focus();
}

const dateFormat = new Intl.DateTimeFormat('fr-FR', { dateStyle: 'long', timeZone: 'UTC' });
function displayDate(value) {
  return dateFormat.format(new Date(value + 'T12:00:00Z'));
}

function renderList() {
  const list = get('dossiers');
  const search = get('search').value.trim().toLocaleLowerCase('fr');
  const filter = get('filter').value;
  const today = new Intl.DateTimeFormat('fr-CA', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const part = key => today.find(item => item.type === key).value;
  const todayDate = [part('year'), part('month'), part('day')].join('-');
  list.replaceChildren();
  for (const dossier of dossiers) {
    const data = dossier.answers;
    const upcoming = !['Brouillon', 'Célébré', 'Annulé'].includes(data.status) && (!data.weddingDate || data.weddingDate >= todayDate);
    if (filter === 'upcoming' && !upcoming) continue;
    if (filter === 'drafts' && data.status !== 'Brouillon') continue;
    const extraNames = Object.entries(data).filter(([key]) => key.endsWith('Extra')).map(([, value]) => value);
    if (![couple(data), ...extraNames, data.groomHebrew, data.brideHebrew, data.weddingPlace].join(' ').toLocaleLowerCase('fr').includes(search)) continue;
    const row = create('article');
    row.className = 'dossier';
    const info = create('div');
    info.append(create('strong', couple(data) || 'Brouillon sans nom'));
    info.append(create('div', [data.weddingDate ? displayDate(data.weddingDate) : 'Date à fixer', data.weddingTime, data.weddingPlace, data.status].filter(Boolean).join(' · ')));
    const progress = create('p', questionProgress(data));
    progress.className = 'question-progress';
    info.append(progress);
    if (data.nextMeeting) info.append(create('div', 'Prochain rendez-vous le ' + displayDate(data.nextMeeting)));
    const open = create('button', 'Ouvrir le dossier');
    open.type = 'button';
    open.onclick = () => switchDossier(dossier);
    row.append(info, open);
    list.append(row);
  }
  if (!list.children.length) list.append(create('p', search ? 'Aucun couple ne correspond à la recherche.' : filter === 'drafts' ? 'Aucun brouillon.' : 'Aucun dossier à afficher.'));
}

async function connect(adminPassword, automatic = false) {
  const submit = login.querySelector('button');
  if (submit.disabled) return;
  submit.disabled = true;
  password = adminPassword;
  try {
    const data = await request('/dossiers');
    if (!schema.length) {
      const configuration = await request('/schema');
      schema = arrangeSections(configuration.schema);
      buildFields(configuration.documentStatuses);
    }
    dossiers = data.dossiers;
    const savedDossier = wideView && dossiers.find(dossier => dossier.id === launch.get('dossier'));
    const step = Number(launch.get('etape'));
    openDossier(savedDossier || undefined, wideView && Number.isInteger(step) && step >= 0 && step < formSteps.length ? step : 0);
    const listFilter = launch.get('liste');
    if (wideView && ['upcoming', 'drafts', 'all'].includes(listFilter)) {
      get('filter').value = listFilter;
      showTab('list');
    }
    renderList();
    login.reset();
    login.hidden = true;
    get('logout').hidden = false;
    get('workspace').hidden = false;
    get(get('list-panel').hidden ? 'form-tab' : 'list-tab').focus();
  } catch (error) {
    password = '';
    if (!automatic) feedback(error.message);
  } finally {
    submit.disabled = false;
  }
}

login.onsubmit = event => {
  event.preventDefault();
  void connect(get('password').value);
};

function savedDashboardPassword() {
  try {
    const embedded = window.parent !== window && window.parent.document.getElementById('mariages-frame') === window.frameElement;
    const standaloneDashboard = wideView && window.parent === window && location.origin === 'https://bhsmaurice.github.io';
    if (!embedded && !standaloneDashboard) return '';
    const session = JSON.parse(localStorage.getItem('shliah_session') || 'null');
    if (session?.role !== 'admin' || !Number.isFinite(session.until) || session.until <= Date.now()) return '';
    return localStorage.getItem('railway_admin_pw') || '';
  } catch (_) {
    return '';
  }
}

{
  const savedPassword = savedDashboardPassword();
  if (savedPassword) void connect(savedPassword, true);
}

get('logout').onclick = () => {
  if (dirty && !window.confirm('Abandonner les modifications non enregistrées ?')) return;
  password = '';
  dossiers = [];
  current = undefined;
  dirty = false;
  form.reset();
  get('search').value = '';
  get('dossiers').replaceChildren();
  get('print-sheet').replaceChildren();
  get('workspace').hidden = true;
  get('logout').hidden = true;
  login.hidden = false;
  feedback();
  get('password').focus();
};

get('previous-step').onclick = () => showStep(activeStep - 1, true);
get('next-step').onclick = () => showStep(activeStep + 1, true);
form.addEventListener('invalid', event => {
  const firstInvalid = Array.from(form.elements).find(control => control.willValidate && !control.validity.valid);
  if (event.target !== firstInvalid) return;
  const page = event.target.closest('.form-step');
  const step = formSteps.findIndex(([, , section]) => section === page);
  if (step >= 0) showStep(step);
}, true);
form.oninput = event => {
  if (questionControls.has(event.target.name) && event.target.value.trim()) skippedQuestions.delete(event.target.name);
  dirty = true;
  refreshQuestionProgress();
};
window.addEventListener('beforeunload', event => {
  if (dirty) event.preventDefault();
});

form.onsubmit = async event => {
  event.preventDefault();
  if (busy) return;
  const answers = readQuestionAnswers();
  const draft = event.submitter?.id === 'save-draft';
  if (draft) answers.status = 'Brouillon';
  else if (answers.status === 'Brouillon') answers.status = 'À compléter';
  if (!draft && !couple(answers)) {
    feedback('Renseigne au moins un des deux noms.');
    showStep(0);
    form.elements.groomGivenNames.focus();
    return;
  }
  setBusy(true);
  try {
    const { dossier } = await request('/dossiers/' + current.id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ revision: current.revision, answers })
    });
    dossiers = [...dossiers.filter(item => item.id !== dossier.id), dossier];
    dossiers.sort((a, b) => (a.answers.weddingDate || '9999').localeCompare(b.answers.weddingDate || '9999'));
    openDossier(dossier, activeStep);
    if (draft) get('filter').value = 'drafts';
    else if (get('filter').value === 'drafts') get('filter').value = 'all';
    renderList();
    feedback(draft ? 'Brouillon enregistré.' : 'Dossier enregistré.');
  } catch (error) {
    feedback(error.message);
  } finally {
    setBusy(false);
  }
};

async function printBlank() {
  const sheet = get('print-sheet');
  sheet.replaceChildren();
  sheet.classList.add('blank-print');
  const starts = ['Rendez-vous', 'Cortège et organisation', 'Ketouba'];
  const headings = ['Premier rendez-vous', 'Déroulé de la ‘houppa', 'Ketouba, matériel et documents'];
  let page;
  let witnesses;
  let honorees;
  for (const [title, fields, person] of schema) {
    const pageIndex = starts.indexOf(title);
    if (pageIndex !== -1 || !page) {
      page = create('div');
      page.className = 'paper-page';
      const header = create('header');
      if (pageIndex === 0) {
        const brand = create('div');
        brand.className = 'paper-brand';
        const logo = create('img');
        logo.alt = 'Beth Habad S Maurice';
        logo.src = printLogo;
        brand.append(logo, create('strong', 'Beth Habad S Maurice'), create('span', '30 Avenue du Maréchal de Lattre de Tassigny, 94410 S Maurice · Tél. 07 70 24 17 46'));
        header.append(brand);
      }
      header.append(create('h1', headings[pageIndex] || 'Mariages'));
      page.append(header);
      sheet.append(page);
    }
    const section = create('section');
    section.append(create('h2', title));
    const equipment = fields.some(([key]) => key === 'cupsOwner');
    const grid = create('div');
    grid.className = equipment ? 'paper-equipment' : 'paper-columns';
    for (const [key, label, type] of fields) {
      const heading = parentsHeading(person, key);
      if (heading) grid.append(heading);
      if (typeof type === 'string' && /^(?:legacy|archived|name-extra)/.test(type)) continue;
      const field = create('div');
      field.className = 'paper-field';
      if (type === 'checkbox') {
        field.className = 'paper-check';
        const box = create('span');
        box.className = 'paper-box';
        field.append(box, 'Prêt');
      } else {
        field.append(create('span', label));
        const line = create('span');
        line.className = 'paper-line';
        field.append(line);
        if (equipment && !key.endsWith('Owner')) field.classList.add('full');
        if ((/MemorialNames$/.test(key) || ['processionOrder', 'notes'].includes(key))) field.append(line.cloneNode());
      }
      grid.append(field);
    }
    section.append(grid);
    if (person === 'witness') {
      if (!witnesses) {
        witnesses = create('div');
        witnesses.className = 'paper-witnesses';
        page.append(witnesses);
      }
      witnesses.append(section);
    } else if (person?.endsWith('-honors')) {
      if (!honorees) {
        honorees = create('div');
        honorees.className = 'paper-witnesses';
        page.append(honorees);
      }
      honorees.append(section);
    } else {
      page.append(section);
    }
  }
  const logo = sheet.querySelector('img');
  if (logo) await logo.decode().catch(() => {});
  window.print();
}

get('blank-pdf').onclick = printBlank;

get('pdf').onclick = () => {
  const answers = Object.fromEntries(new FormData(form));
  const print = get('print-sheet');
  print.classList.remove('blank-print');
  print.replaceChildren(create('p', 'Beth Habad S Maurice · Dossier de mariage'), create('h1', couple(answers) || 'Premier rendez-vous'));
  for (const [title, fields, person] of schema) {
    const section = create('section');
    section.append(create('h2', title));
    for (const [key, label, type] of fields) {
      const heading = parentsHeading(person, key);
      if (heading && fields.some(([field]) => field.startsWith(person) && /(?:Parents|Father|Mother)/.test(field) && answers[field])) {
        section.append(heading);
      }
      if (typeof type === 'string' && type.startsWith('archived')) continue;
      if (!answers[key] && type !== 'checkbox') continue;
      const line = create('p');
      const answer = create('bdi', type === 'date' ? displayDate(answers[key]) : answers[key] || 'À préparer');
      if (type === 'hebrew') {
        answer.dir = 'rtl';
        answer.lang = 'he';
      }
      line.append(create('strong', label + ' — '), answer);
      section.append(line);
    }
    if (section.children.length > 1) print.append(section);
  }
  window.print();
};
window.addEventListener('afterprint', () => {
  get('print-sheet').classList.remove('blank-print');
  get('print-sheet').replaceChildren();
});

get('form-tab').onclick = () => { if (!busy) showTab('form'); };
get('list-tab').onclick = () => { if (!busy) { renderList(); showTab('list'); } };
for (const tab of ['form', 'list']) {
  get(tab + '-tab').onkeydown = event => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key) || busy) return;
    event.preventDefault();
    const next = event.key === 'Home' ? 'form' : event.key === 'End' ? 'list' : tab === 'form' ? 'list' : 'form';
    get(next + '-tab').click();
    get(next + '-tab').focus();
  };
}
get('search').oninput = renderList;
get('filter').onchange = renderList;
get('new-form').onclick = () => switchDossier();
get('new-list').onclick = () => switchDossier();
get('refresh').onclick = async () => {
  setBusy(true);
  try {
    dossiers = (await request('/dossiers')).dossiers;
    renderList();
    feedback();
  } catch (error) {
    feedback(error.message);
  } finally {
    setBusy(false);
  }
};
