<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Test PIN</title>
<style>
body {
  background: #0B0B14;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
}
.container {
  text-align: center;
  color: white;
}
input {
  width: 200px;
  padding: 10px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin: 20px 0;
}
button {
  width: 200px;
  padding: 12px;
  background: #B8972A;
  color: #0B0B14;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}
button:active {
  background: #8A6E1A;
}
.msg {
  margin-top: 20px;
  font-size: 14px;
  color: #aaa;
}
</style>
</head>
<body>
<div class="container">
  <h1>🤖 TEST PIN</h1>
  <p>Tape: 194561</p>
  <input type="tel" id="pin" placeholder="Code PIN" maxlength="6">
  <br>
  <button onclick="testClick()">✓ Valider</button>
  <div class="msg" id="msg"></div>
</div>

<script>
function testClick() {
  const pin = document.getElementById('pin').value;
  const msg = document.getElementById('msg');
  if (pin === '194561') {
    msg.textContent = '✓ BON CODE!';
    msg.style.color = '#2D7A4F';
  } else {
    msg.textContent = '✗ Mauvais code. Attendu: 194561, Tu as: ' + pin;
    msg.style.color = '#C0392B';
  }
}
</script>
</body>
</html>
