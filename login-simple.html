<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Shliah Bot Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  height: 100vh;
  background: linear-gradient(160deg, #0B0B14 0%, #1A1233 55%, #2D2166 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Heebo', Arial, sans-serif;
}
.login-box {
  text-align: center;
  color: white;
  background: rgba(0,0,0,0.3);
  padding: 40px;
  border-radius: 20px;
  max-width: 400px;
  width: 90%;
}
.logo { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
.subtitle { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 30px; }
.input-area {
  margin: 20px 0;
}
input {
  width: 200px;
  padding: 15px;
  font-size: 24px;
  text-align: center;
  border: 2px solid #B8972A;
  border-radius: 12px;
  background: rgba(255,255,255,0.1);
  color: #B8972A;
  letter-spacing: 8px;
  font-weight: bold;
}
input::placeholder { color: rgba(255,255,255,0.3); }
.btn-grid {
  display: grid;
  grid-template-columns: repeat(3, 70px);
  gap: 10px;
  margin: 20px auto;
  justify-content: center;
}
button {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.2);
  color: white;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
  font-family: Arial, sans-serif;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
button:active {
  background: #B8972A;
  border-color: #B8972A;
  transform: scale(0.95);
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.del-btn { font-size: 20px; }
.msg { margin-top: 20px; font-size: 13px; color: #aaa; height: 20px; }
.msg.error { color: #ff6b6b; }
.msg.success { color: #51cf66; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">🤖 Shliah Bot</div>
  <div class="subtitle">Panneau d'administration</div>
  
  <div class="input-area">
    <input type="text" id="code" placeholder="●●●●●●" maxlength="6">
  </div>

  <div class="btn-grid">
    <button onclick="addDigit('1')">1</button>
    <button onclick="addDigit('2')">2</button>
    <button onclick="addDigit('3')">3</button>
    <button onclick="addDigit('4')">4</button>
    <button onclick="addDigit('5')">5</button>
    <button onclick="addDigit('6')">6</button>
    <button onclick="addDigit('7')">7</button>
    <button onclick="addDigit('8')">8</button>
    <button onclick="addDigit('9')">9</button>
    <button onclick="addDigit('0')">0</button>
    <button class="del-btn" onclick="deleteLast()">⌫</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
const correctCode = '194561';

function addDigit(digit) {
  const input = document.getElementById('code');
  if (input.value.length < 6) {
    input.value += digit;
    checkCode();
  }
}

function deleteLast() {
  const input = document.getElementById('code');
  input.value = input.value.slice(0, -1);
  clearMessage();
}

function checkCode() {
  const input = document.getElementById('code');
  console.log('Code tapé:', input.value, 'Longueur:', input.value.length);
  if (input.value.length === 6) {
    if (input.value === correctCode) {
      console.log('Code correct! Création de session...');
      showSuccess('✓ Accès autorisé!');
      // Créer la session
      const SESSION_KEY = 'shliah_session';
      const SESSION_DURATION = 30 * 24 * 60 * 60 * 1000;
      const session = {
        role: 'admin',
        until: Date.now() + SESSION_DURATION
      };
      console.log('Session:', JSON.stringify(session));
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      console.log('Session sauvegardée. Redirection...');
      setTimeout(() => {
        console.log('Redirection vers admin.html...');
        window.location.href = 'https://bhsmaurice.github.io/agent-shliah/admin.html';
      }, 2000);
    } else {
      console.log('Code incorrect. Attendu: ' + correctCode + ', Reçu: ' + input.value);
      showError('✗ Code incorrect');
      input.value = '';
    }
  } else {
    console.log('Code incomplet:', input.value.length + '/6');
  }
}

function showError(msg) {
  const el = document.getElementById('msg');
  el.textContent = msg;
  el.className = 'msg error';
}

function showSuccess(msg) {
  const el = document.getElementById('msg');
  el.textContent = msg;
  el.className = 'msg success';
}

function clearMessage() {
  document.getElementById('msg').textContent = '';
}

// Gérer l'input texte directement
document.getElementById('code').addEventListener('input', function(e) {
  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
  clearMessage();
});

// Enter pour valider
document.getElementById('code').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && this.value.length === 6) {
    checkCode();
  }
});
</script>
</body>
</html>
