<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shliah Admin - Option 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #ffffff; color: #1a1a1a; }
        
        .header { background: white; border-bottom: 1px solid #e5e5e5; padding: 16px 20px; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 18px; font-weight: 700; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #e5e5e5; padding-bottom: 12px; }
        .tab { padding: 8px 16px; background: none; border: none; font-size: 13px; font-weight: 600; color: #999; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: #1a1a1a; border-bottom-color: #000; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #f5f5f5; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 28px; font-weight: 700; color: #3b82f6; margin: 8px 0; }
        .stat-label { font-size: 12px; color: #666; }
        
        .sections-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .section { background: #f9f9f9; border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
        .section-title { padding: 12px 16px; background: #f0f0f0; font-weight: 700; font-size: 13px; border-bottom: 1px solid #e5e5e5; }
        .section-body { padding: 12px 0; max-height: 300px; overflow-y: auto; }
        .item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .badge { background: #e3f2fd; color: #1976d2; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
        
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .sections-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Shliah Admin</h1>
    </div>
    
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="showPage(0)">📊 Dashboard</button>
            <button class="tab" onclick="showPage(1)">📝 Infos</button>
            <button class="tab" onclick="showPage(2)">👥 Contacts</button>
            <button class="tab" onclick="showPage(3)">💰 Paiements</button>
        </div>
        
        <div class="page active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="font-size: 24px;">📋</div>
                    <div class="stat-number">1.2K</div>
                    <div class="stat-label">Messages</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 24px;">👥</div>
                    <div class="stat-number">542</div>
                    <div class="stat-label">Users</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 24px;">💰</div>
                    <div class="stat-number">€2.8K</div>
                    <div class="stat-label">Dons</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 24px;">📩</div>
                    <div class="stat-number">15</div>
                    <div class="stat-label">Demandes</div>
                </div>
            </div>
            
            <div class="sections-grid">
                <div class="section">
                    <div class="section-title">💬 Conversations</div>
                    <div class="section-body">
                        <div class="item"><div>Sarah Cohen</div><span class="badge">5</span></div>
                        <div class="item"><div>Marc Levy</div><span class="badge">3</span></div>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">📩 Demandes</div>
                    <div class="section-body">
                        <div class="item"><div>Cerfa - Eli</div><span class="badge">En attente</span></div>
                        <div class="item"><div>Sefer - Miri</div><span class="badge">En attente</span></div>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">💳 Paiements</div>
                    <div class="section-body">
                        <div class="item"><div>Sarah - €50</div><span class="badge">Payé</span></div>
                        <div class="item"><div>Marc - €100</div><span class="badge">Payé</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function showPage(i) {
            document.querySelectorAll('.page').forEach((p, j) => p.classList.toggle('active', i === j));
            document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('active', i === j));
        }
    </script>
</body>
</html>
