<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tsedaka - Paiements</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .login-box { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 1px 3px; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; }
    .login-box button { background: #7c3aed; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .stat { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px; }
    .stat-value { font-size: 32px; font-weight: 700; color: #7c3aed; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .error { color: #dc2626; padding: 20px; background: #fee2e2; border-radius: 8px; }
    .debug { font-size: 12px; color: #666; background: #f0f0f0; padding: 15px; border-radius: 6px; margin-top: 10px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-box">
      <h2>Tsedaka - Paiements</h2>
      <label>Mot de passe :</label>
      <input type="password" id="pw" value="levi770">
      <button onclick="tester()">Tester</button>
      <div id="result" class="debug" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script>
    function tester() {
      var pw = document.getElementById('pw').value;
      var url = 'https://agent-shliah-production.up.railway.app/admin/tsedaka/dons?password=' + encodeURIComponent(pw);
      
      fetch(url)
        .then(r => r.json())
        .then(data => {
          var html = 'Mot de passe: <strong>' + pw + '</strong><br>';
          html += 'OK: ' + data.ok + '<br>';
          html += 'Message: ' + (data.message || 'Aucun') + '<br>';
          if (data.dons) html += 'Dons trouvés: ' + data.dons.length;
          document.getElementById('result').innerHTML = html;
        })
        .catch(e => {
          document.getElementById('result').innerHTML = 'ERREUR: ' + e.message;
        });
    }
    
    // Tester automatiquement au chargement
    tester();
  </script>
</body>
</html>
