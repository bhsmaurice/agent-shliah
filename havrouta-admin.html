<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Havruta Admin - Beth Habad</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 { font-size: 28px; }
    .header p { font-size: 14px; opacity: 0.9; margin-top: 5px; }
    
    .header-actions { display: flex; gap: 10px; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-primary { background: white; color: #667eea; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    .btn-secondary { background: rgba(255,255,255,0.2); color: white; }
    .btn-secondary:hover { background: rgba(255,255,255,0.3); }
    
    .content {
      padding: 30px;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
    }
    
    .tab-btn {
      padding: 12px 24px;
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 600;
      color: #999;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }
    
    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    
    .card {
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s;
    }
    
    .card:hover {
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transform: translateY(-5px);
    }
    
    .card h3 {
      margin-bottom: 10px;
      color: #667eea;
    }
    
    .card-info {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      line-height: 1.6;
    }
    
    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .btn-small {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    
    .btn-edit { background: #667eea; color: white; }
    .btn-delete { background: #ff6b6b; color: white; }
    .btn-seance { background: #51cf66; color: white; }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    
    .form-group textarea { resize: vertical; min-height: 100px; }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.active { display: flex; }
    
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #667eea;
    }
    
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    
    .alert.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>📚 Havruta Admin</h1>
        <p>Gestion des paires d'étude Torah</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openModalNewHavruta()">+ Nouvelle paire</button>
        <button class="btn btn-secondary" onclick="logout()">Se déconnecter</button>
      </div>
    </div>
    
    <div class="content">
      <div id="alert-container"></div>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('havroutim')">📋 Paires</button>
        <button class="tab-btn" onclick="switchTab('statistiques')">📊 Statistiques</button>
      </div>
      
      <div id="havroutim" class="tab-content active">
        <div class="grid" id="havroutim-grid">
          <p style="grid-column: 1/-1; text-align: center; color: #999;">Chargement...</p>
        </div>
      </div>
      
      <div id="statistiques" class="tab-content">
        <div style="text-align: center; padding: 40px; color: #999;">
          <p>Statistiques en cours de développement...</p>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modal Nouvelle Havruta -->
  <div id="modal-havruta" class="modal">
    <div class="modal-content">
      <div class="modal-header">📚 Créer une paire d'étude</div>
      <form id="form-havruta" style="display: none;">
        <div class="form-row">
          <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="p1_prenom" required>
          </div>
          <div class="form-group">
            <label>Nom</label>
            <input type="text" id="p1_nom" required>
          </div>
        </div>
        
        <div class="form-group">
          <label>Téléphone</label>
          <input type="text" id="p1_phone" placeholder="06... ou +33..." required>
        </div>
        
        <div class="form-group">
          <label>Niveau d'étude</label>
          <select id="p1_niveau" required>
            <option value="">-- Sélectionne --</option>
            <option value="Débutant">Débutant</option>
            <option value="Intermédiaire">Intermédiaire</option>
            <option value="Avancé">Avancé</option>
          </select>
        </div>
        
        <div class="form-group">
          <label><input type="checkbox" id="seul"> Étudier seul (avec un coordo)</label>
        </div>
        
        <div id="p2-fields" style="display: none;">
          <hr style="margin: 20px 0;">
          <h3 style="margin-bottom: 15px;">Personne 2</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label>Prénom</label>
              <input type="text" id="p2_prenom">
            </div>
            <div class="form-group">
              <label>Nom</label>
              <input type="text" id="p2_nom">
            </div>
          </div>
          
          <div class="form-group">
            <label>Téléphone</label>
            <input type="text" id="p2_phone" placeholder="06... ou +33...">
          </div>
          
          <div class="form-group">
            <label>Niveau d'étude</label>
            <select id="p2_niveau">
              <option value="">-- Sélectionne --</option>
              <option value="Débutant">Débutant</option>
              <option value="Intermédiaire">Intermédiaire</option>
              <option value="Avancé">Avancé</option>
            </select>
          </div>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-havruta')" style="flex: 1;">Annuler</button>
          <button type="submit" class="btn btn-primary" style="flex: 1; background: #667eea; color: white;">Créer</button>
        </div>
      </form>
    </div>
  </div>
  
  <script>
    const BASE_URL = 'https://agent-shliah-production.up.railway.app';
    const PASSWORD = prompt('🔐 PIN Admin Havruta:');
    
    if (!PASSWORD) {
      alert('Accès refusé');
      window.location.href = '/';
    }
    
    let havroutim = [];
    
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }
    
    function showAlert(msg, type = 'success') {
      const container = document.getElementById('alert-container');
      const div = document.createElement('div');
      div.className = `alert ${type}`;
      div.textContent = msg;
      container.appendChild(div);
      setTimeout(() => div.remove(), 4000);
    }
    
    function openModalNewHavruta() {
      document.getElementById('modal-havruta').classList.add('active');
    }
    
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }
    
    document.getElementById('seul').addEventListener('change', function() {
      document.getElementById('p2-fields').style.display = this.checked ? 'none' : 'block';
    });
    
    document.getElementById('form-havruta').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const seul = document.getElementById('seul').checked;
      const data = {
        password: PASSWORD,
        personne1_prenom: document.getElementById('p1_prenom').value,
        personne1_nom: document.getElementById('p1_nom').value,
        personne1_phone: document.getElementById('p1_phone').value,
        personne1_niveau: document.getElementById('p1_niveau').value,
        personne2_phone: seul ? null : document.getElementById('p2_phone').value,
        personne2_nom: seul ? null : document.getElementById('p2_nom').value,
        personne2_prenom: seul ? null : document.getElementById('p2_prenom').value,
        personne2_niveau: seul ? null : document.getElementById('p2_niveau').value,
        coordinateur_phone: PASSWORD.replace(/\D/g, '').slice(-10)
      };
      
      try {
        const res = await fetch(`${BASE_URL}/api/havrouta/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (result.ok) {
          showAlert('✅ Paire créée!');
          closeModal('modal-havruta');
          this.reset();
          loadHavroutim();
        } else {
          showAlert('❌ Erreur: ' + result.error, 'error');
        }
      } catch (err) {
        showAlert('❌ Erreur: ' + err.message, 'error');
      }
    });
    
    async function loadHavroutim() {
      try {
        const res = await fetch(`${BASE_URL}/api/havrouta/list?password=${PASSWORD}`);
        const result = await res.json();
        
        if (!result.ok) {
          showAlert('❌ Erreur: ' + result.error, 'error');
          return;
        }
        
        havroutim = result.data;
        renderHavroutim();
      } catch (err) {
        showAlert('❌ Erreur chargement: ' + err.message, 'error');
      }
    }
    
    function renderHavroutim() {
      const grid = document.getElementById('havroutim-grid');
      
      if (havroutim.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">Aucune paire encore. Créez-en une!</p>';
        return;
      }
      
      grid.innerHTML = havroutim.map(h => `
        <div class="card">
          <h3>👥 ${h.personne1_prenom} ${h.personne1_nom}</h3>
          <div class="card-info">
            <strong>Niveau:</strong> ${h.personne1_niveau}<br>
            <strong>Tél:</strong> ${h.personne1_phone}
          </div>
          
          ${h.personne2_phone ? `
            <hr style="margin: 10px 0;">
            <div style="font-size: 12px; margin-top: 10px;">
              <strong>Paire:</strong> ${h.personne2_prenom} ${h.personne2_nom} (${h.personne2_niveau})
            </div>
          ` : `
            <div style="font-size: 12px; color: #999; margin-top: 10px;">
              📌 Étude seule
            </div>
          `}
          
          <div class="card-actions">
            <button class="btn-small btn-seance" onclick="openSeanceModal(${h.id})">➕ Séance</button>
            <button class="btn-small btn-edit" onclick="editHavruta(${h.id})">✏️ Éditer</button>
          </div>
        </div>
      `).join('');
    }
    
    function openSeanceModal(havroutaId) {
      alert('Fonctionnalité séance à implémenter!');
    }
    
    function editHavruta(id) {
      alert('Fonctionnalité édition à implémenter!');
    }
    
    function logout() {
      if (confirm('Déconnexion?')) {
        window.location.href = '/';
      }
    }
    
    // Charger les données au démarrage
    loadHavroutim();
  </script>
</body>
</html>
