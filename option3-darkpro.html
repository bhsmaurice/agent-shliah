<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shliah Admin - Option 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); color: #e2e8f0; min-height: 100vh; }
        
        .header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(148, 163, 184, 0.1); padding: 20px; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .tab { padding: 10px 16px; background: rgba(148, 163, 184, 0.1); border: 1px solid rgba(148, 163, 184, 0.2); font-size: 13px; font-weight: 600; color: #94a3b8; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
        .tab:hover { background: rgba(96, 165, 250, 0.2); }
        .tab.active { background: linear-gradient(135deg, #60a5fa, #a78bfa); border: none; color: white; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        
        .stat-card {
            background: rgba(51, 65, 85, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.2s;
        }
        
        .stat-card:hover {
            border-color: rgba(96, 165, 250, 0.3);
            background: rgba(51, 65, 85, 0.7);
        }
        
        .stat-icon { font-size: 32px; margin-bottom: 8px; }
        .stat-number { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 8px 0; }
        .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        
        .sections-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        
        .section {
            background: rgba(51, 65, 85, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
        }
        
        .section:hover {
            border-color: rgba(96, 165, 250, 0.3);
        }
        
        .section-title { padding: 14px 16px; font-weight: 700; font-size: 13px; background: rgba(148, 163, 184, 0.1); border-bottom: 1px solid rgba(148, 163, 184, 0.1); }
        .section-body { padding: 12px 0; max-height: 300px; overflow-y: auto; }
        .item { padding: 12px 16px; border-bottom: 1px solid rgba(148, 163, 184, 0.05); display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        
        .badge { background: rgba(96, 165, 250, 0.15); color: #60a5fa; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 600; }
        
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .sections-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Shliah Admin</h1>
    </div>
    
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="showPage(0)">📊 Dashboard</button>
            <button class="tab" onclick="showPage(1)">📝 Infos</button>
            <button class="tab" onclick="showPage(2)">👥 Contacts</button>
            <button class="tab" onclick="showPage(3)">💰 Paiements</button>
        </div>
        
        <div class="page active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📋</div>
                    <div class="stat-number">1.2K</div>
                    <div class="stat-label">Messages</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-number">542</div>
                    <div class="stat-label">Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-number">€2.8K</div>
                    <div class="stat-label">Dons</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📩</div>
                    <div class="stat-number">15</div>
                    <div class="stat-label">Demandes</div>
                </div>
            </div>
            
            <div class="sections-grid">
                <div class="section">
                    <div class="section-title">💬 Conversations</div>
                    <div class="section-body">
                        <div class="item"><div>Sarah Cohen</div><span class="badge">5</span></div>
                        <div class="item"><div>Marc Levy</div><span class="badge">3</span></div>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">📩 Demandes</div>
                    <div class="section-body">
                        <div class="item"><div>Cerfa - Eli</div><span class="badge">Attente</span></div>
                        <div class="item"><div>Sefer - Miri</div><span class="badge">Attente</span></div>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">💳 Paiements</div>
                    <div class="section-body">
                        <div class="item"><div>Sarah - €50</div><span class="badge">Payé</span></div>
                        <div class="item"><div>Marc - €100</div><span class="badge">Payé</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function showPage(i) {
            document.querySelectorAll('.page').forEach((p, j) => p.classList.toggle('active', i === j));
            document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('active', i === j));
        }
    </script>
</body>
</html>
