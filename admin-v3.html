<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Shliah Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #1a1a1a;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Login */
        .login-screen {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .login-screen.hidden {
            display: none;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .login-box h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .login-box p {
            color: #666;
            margin-bottom: 24px;
            font-size: 13px;
        }
        
        .login-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        
        /* Header */
        .header {
            background: white;
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 20px;
            color: #667eea;
        }
        
        .logout-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        
        /* Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        
        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }
        
        .stat-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
        }
        
        /* Sections */
        .section {
            background: white;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }
        
        .section-title {
            padding: 14px 16px;
            background: #f9f9f9;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 700;
            font-size: 13px;
        }
        
        .section-body {
            padding: 12px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .item {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        
        .item:last-child {
            border-bottom: none;
        }
        
        .item-name {
            font-weight: 600;
            flex: 1;
        }
        
        .item-time {
            color: #999;
            font-size: 11px;
            margin-top: 2px;
        }
        
        .badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #e3f2fd;
            color: #1976d2;
            white-space: nowrap;
        }
        
        .badge.success {
            background: #e8f5e9;
            color: #388e3c;
        }
        
        .badge.pending {
            background: #fff3e0;
            color: #f57c00;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 0;
        }
        
        .tab {
            padding: 12px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #999;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab:hover {
            color: #667eea;
        }
        
        /* Pages */
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        .page h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #666;
            text-transform: uppercase;
        }
        
        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        
        .btn-group {
            display: flex;
            gap: 8px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            .stat-card {
                padding: 12px;
            }
            
            .stat-number {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div style="font-size: 40px; margin-bottom: 12px;">✨</div>
            <h1>Shliah</h1>
            <p>Admin Panel</p>
            <input type="password" class="login-input" id="pwd" placeholder="Mot de passe" />
            <button class="login-btn" onclick="login()">Accéder</button>
        </div>
    </div>
    
    <!-- App -->
    <div id="app" style="display: none;">
        <div class="header">
            <h1>✨ Shliah Admin</h1>
            <button class="logout-btn" onclick="logout()">Déconnexion</button>
        </div>
        
        <div class="container">
            <!-- Tabs Navigation -->
            <div class="tabs">
                <button class="tab active" onclick="showPage(0)">📊 Dashboard</button>
                <button class="tab" onclick="showPage(1)">📝 Infos</button>
                <button class="tab" onclick="showPage(2)">📖 Histoires</button>
                <button class="tab" onclick="showPage(3)">🎵 Musiques</button>
                <button class="tab" onclick="showPage(4)">👥 Contacts</button>
                <button class="tab" onclick="showPage(5)">💰 Paiements</button>
                <button class="tab" onclick="showPage(6)">📩 Demandes</button>
                <button class="tab" onclick="showPage(7)">🧾 Cerfa</button>
                <button class="tab" onclick="showPage(8)">📢 Broadcast</button>
            </div>
            
            <!-- Pages -->
            
            <!-- Dashboard -->
            <div class="page active">
                <h2>Dashboard 📊</h2>
                
                <!-- Stats -->
                <div class="stats" id="stats">
                    <div class="stat-card">
                        <div class="stat-icon">📋</div>
                        <div class="stat-number">0</div>
                        <div class="stat-label">Messages</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-number">0</div>
                        <div class="stat-label">Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">💰</div>
                        <div class="stat-number">€0</div>
                        <div class="stat-label">Dons</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📩</div>
                        <div class="stat-number">0</div>
                        <div class="stat-label">Demandes</div>
                    </div>
                </div>
                
                <!-- Sections -->
                <div class="main-grid">
                    <div class="section">
                        <div class="section-title">💬 Dernières conversations</div>
                        <div class="section-body" id="conversations"></div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">📩 Demandes en attente</div>
                        <div class="section-body" id="demandes"></div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">💳 Paiements</div>
                        <div class="section-body" id="paiements"></div>
                    </div>
                </div>
            </div>
            
            <!-- Infos -->
            <div class="page">
                <h2>Infos 📝</h2>
                <div class="section">
                    <div class="section-body" id="infos"></div>
                </div>
            </div>
            
            <!-- Histoires -->
            <div class="page">
                <h2>Histoires 📖</h2>
                <div class="section">
                    <div class="section-body" id="histoires"></div>
                </div>
            </div>
            
            <!-- Musiques -->
            <div class="page">
                <h2>Musiques 🎵</h2>
                <div class="section">
                    <div class="section-body" id="musiques"></div>
                </div>
            </div>
            
            <!-- Contacts -->
            <div class="page">
                <h2>Contacts 👥</h2>
                <p id="contactsCount" style="color: #999; font-size: 12px; margin-bottom: 12px;"></p>
                <button class="btn-secondary" onclick="exportContacts()" style="margin-bottom: 12px;">📥 Export CSV</button>
                <div class="section">
                    <div class="section-body" id="contacts"></div>
                </div>
            </div>
            
            <!-- Paiements -->
            <div class="page">
                <h2>Paiements 💰</h2>
                <p id="paiementsCount" style="color: #999; font-size: 12px; margin-bottom: 12px;"></p>
                <div class="section">
                    <div class="section-body" id="allPaiements"></div>
                </div>
            </div>
            
            <!-- Demandes -->
            <div class="page">
                <h2>Demandes 📩</h2>
                <p id="demandesCount" style="color: #999; font-size: 12px; margin-bottom: 12px;"></p>
                <div class="section">
                    <div class="section-body" id="allDemandes"></div>
                </div>
            </div>
            
            <!-- Cerfa -->
            <div class="page">
                <h2>Cerfa 🧾</h2>
                <p id="cerfaCount" style="color: #999; font-size: 12px; margin-bottom: 12px;"></p>
                <button class="btn-secondary" onclick="exportCerfa()" style="margin-bottom: 12px;">📥 Export CSV</button>
                <div class="section">
                    <div class="section-body" id="cerfa"></div>
                </div>
            </div>
            
            <!-- Broadcast -->
            <div class="page">
                <h2>Broadcast 📢</h2>
                <div class="section" style="padding: 16px;">
                    <div class="form-group">
                        <label class="form-label">Message</label>
                        <textarea class="form-textarea" id="broadcastMsg" placeholder="Ton message..."></textarea>
                    </div>
                    <button class="btn-primary" onclick="sendBroadcast()">📤 Envoyer à tous</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API = 'https://agent-shliah-production.up.railway.app';
        let pwd = null;
        
        function login() {
            pwd = document.getElementById('pwd').value;
            fetch(`${API}/admin/stats?password=${pwd}&t=${Date.now()}`)
                .then(r => r.json())
                .then(d => {
                    if (!d.ok) throw new Error('Erreur');
                    sessionStorage.setItem('pwd', pwd);
                    show();
                    load();
                })
                .catch(() => alert('Erreur mot de passe'));
        }
        
        function show() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('app').style.display = 'block';
        }
        
        function showPage(i) {
            document.querySelectorAll('.page').forEach((p, idx) => {
                p.classList.toggle('active', i === idx);
            });
            document.querySelectorAll('.tab').forEach((t, idx) => {
                t.classList.toggle('active', i === idx);
            });
            
            if (i === 1) loadInfos();
            if (i === 2) loadHistoires();
            if (i === 3) loadMusiques();
            if (i === 4) loadContacts();
            if (i === 5) loadAllPaiements();
            if (i === 6) loadAllDemandes();
            if (i === 7) loadCerfa();
        }
        
        async function load() {
            const res = await fetch(`${API}/admin/stats?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            
            if (data.ok) {
                const s = data.stats;
                const stats = document.getElementById('stats');
                stats.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-icon">📋</div>
                        <div class="stat-number">${s.messages}</div>
                        <div class="stat-label">Messages</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-number">${s.users}</div>
                        <div class="stat-label">Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">💰</div>
                        <div class="stat-number">€${Math.round(s.dons)}</div>
                        <div class="stat-label">Dons</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📩</div>
                        <div class="stat-number">${s.demandes}</div>
                        <div class="stat-label">Demandes</div>
                    </div>
                `;
            }
            
            loadConversations();
            loadDemandes();
            loadPaiements();
        }
        
        async function loadConversations() {
            const res = await fetch(`${API}/admin/conversations/liste?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                const html = data.contacts.slice(0, 8).map(c => `
                    <div class="item">
                        <div>
                            <div class="item-name">${c.prenom || c.phone}</div>
                            <div class="item-time">${formatTime(new Date(c.derniere_date))} • ${c.nb_messages} msg</div>
                        </div>
                        <span class="badge">${c.nb_messages}</span>
                    </div>
                `).join('');
                document.getElementById('conversations').innerHTML = html;
            }
        }
        
        async function loadDemandes() {
            const res = await fetch(`${API}/admin/demandes?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                const dem = data.demandes.filter(d => d.statut === 'nouveau' || d.statut === 'en_attente').slice(0, 8);
                const html = dem.map(d => `
                    <div class="item">
                        <div>
                            <div class="item-name">${d.type} • ${d.prenom || d.phone}</div>
                            <div class="item-time">${formatTime(new Date(d.created_at))}</div>
                        </div>
                        <span class="badge pending">En attente</span>
                    </div>
                `).join('');
                document.getElementById('demandes').innerHTML = html;
            }
        }
        
        async function loadPaiements() {
            const res = await fetch(`${API}/admin/paiements?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                const html = data.paiements.slice(0, 8).map(p => `
                    <div class="item">
                        <div>
                            <div class="item-name">${p.nom || p.phone} • €${p.montant}</div>
                            <div class="item-time">${formatTime(new Date(p.created_at))}</div>
                        </div>
                        <span class="badge ${p.statut === 'paye' ? 'success' : 'pending'}">${p.statut}</span>
                    </div>
                `).join('');
                document.getElementById('paiements').innerHTML = html;
            }
        }
        
        async function loadInfos() {
            const res = await fetch(`${API}/admin/list?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                const html = data.infos.map(i => `
                    <div class="item">
                        <div class="item-name">${i.titre}</div>
                        <span class="badge">${i.categorie}</span>
                    </div>
                `).join('');
                document.getElementById('infos').innerHTML = html;
            }
        }
        
        async function loadHistoires() {
            const res = await fetch(`${API}/admin/histoires?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                const html = data.histoires.map(h => `
                    <div class="item">
                        <div class="item-name">${h.titre}</div>
                        <span class="badge">${formatTime(new Date(h.created_at))}</span>
                    </div>
                `).join('');
                document.getElementById('histoires').innerHTML = html;
            }
        }
        
        async function loadMusiques() {
            const res = await fetch(`${API}/admin/musiques?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                const html = data.musiques.map(m => `
                    <div class="item">
                        <div class="item-name">${m.titre}</div>
                        <span class="badge">${m.ambiance}</span>
                    </div>
                `).join('');
                document.getElementById('musiques').innerHTML = html;
            }
        }
        
        async function loadContacts() {
            const res = await fetch(`${API}/admin/broadcast/contacts?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                document.getElementById('contactsCount').innerText = `${data.contacts.length} contacts`;
                const html = data.contacts.slice(0, 30).map(c => `
                    <div class="item">
                        <div class="item-name">${c.nom || c.phone}</div>
                        <span class="badge">${c.phone}</span>
                    </div>
                `).join('');
                document.getElementById('contacts').innerHTML = html;
            }
        }
        
        async function loadAllPaiements() {
            const res = await fetch(`${API}/admin/paiements?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                const pending = data.paiements.filter(p => p.statut !== 'paye').length;
                document.getElementById('paiementsCount').innerText = `${pending} en attente sur ${data.paiements.length}`;
                const html = data.paiements.map(p => `
                    <div class="item">
                        <div>
                            <div class="item-name">${p.nom || p.phone} • €${p.montant}</div>
                            <div class="item-time">${formatTime(new Date(p.created_at))} • ${p.nb_relances} relances</div>
                        </div>
                        <span class="badge ${p.statut === 'paye' ? 'success' : 'pending'}">${p.statut}</span>
                    </div>
                `).join('');
                document.getElementById('allPaiements').innerHTML = html;
            }
        }
        
        async function loadAllDemandes() {
            const res = await fetch(`${API}/admin/demandes?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                const pending = data.demandes.filter(d => d.statut === 'nouveau' || d.statut === 'en_attente').length;
                document.getElementById('demandesCount').innerText = `${pending} en attente sur ${data.demandes.length}`;
                const html = data.demandes.map(d => `
                    <div class="item">
                        <div>
                            <div class="item-name">${d.type} • ${d.prenom || d.phone}</div>
                            <div class="item-time">${formatTime(new Date(d.created_at))}</div>
                        </div>
                        <span class="badge pending">${d.statut}</span>
                    </div>
                `).join('');
                document.getElementById('allDemandes').innerHTML = html;
            }
        }
        
        async function loadCerfa() {
            const res = await fetch(`${API}/admin/cerfa?password=${pwd}&t=${Date.now()}`);
            const data = await res.json();
            if (data.ok) {
                document.getElementById('cerfaCount').innerText = `${data.cerfa_receipts.length} reçus générés`;
                const html = data.cerfa_receipts.slice(0, 30).map(c => `
                    <div class="item">
                        <div>
                            <div class="item-name">#${c.numero} ${c.nom} ${c.prenom}</div>
                            <div class="item-time">€${c.montant} • ${formatTime(new Date(c.created_at))}</div>
                        </div>
                        <span class="badge success">✓</span>
                    </div>
                `).join('');
                document.getElementById('cerfa').innerHTML = html;
            }
        }
        
        async function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if (!msg) { alert('Écris un message'); return; }
            if (!confirm('Envoyer à tous?')) return;
            
            const res = await fetch(`${API}/admin/broadcast/send`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pwd, texte_libre: msg})
            });
            
            const data = await res.json();
            if (data.ok) {
                alert('Envoyé! ✓');
                document.getElementById('broadcastMsg').value = '';
            } else {
                alert('Erreur');
            }
        }
        
        function exportContacts() {
            fetch(`${API}/admin/broadcast/contacts?password=${pwd}&t=${Date.now()}`)
                .then(r => r.json())
                .then(d => {
                    let csv = 'Nom,Téléphone\n';
                    d.contacts.forEach(c => {
                        csv += `"${c.nom || ''}","${c.phone}"\n`;
                    });
                    downloadCSV(csv, 'contacts.csv');
                });
        }
        
        function exportCerfa() {
            fetch(`${API}/admin/cerfa?password=${pwd}&t=${Date.now()}`)
                .then(r => r.json())
                .then(d => {
                    let csv = 'Numéro,Nom,Prénom,Montant,Date\n';
                    d.cerfa_receipts.forEach(c => {
                        csv += `"${c.numero}","${c.nom}","${c.prenom || ''}","${c.montant}","${new Date(c.created_at).toLocaleDateString('fr-FR')}"\n`;
                    });
                    downloadCSV(csv, 'cerfa.csv');
                });
        }
        
        function downloadCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
        }
        
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            const mins = Math.floor(diff / 60000);
            const hrs = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (mins < 1) return 'Maintenant';
            if (mins < 60) return `${mins}m`;
            if (hrs < 24) return `${hrs}h`;
            if (days < 7) return `${days}j`;
            return date.toLocaleDateString('fr-FR');
        }
        
        function logout() {
            sessionStorage.removeItem('pwd');
            location.reload();
        }
        
        window.addEventListener('load', () => {
            pwd = sessionStorage.getItem('pwd');
            if (pwd) {
                show();
                load();
            }
        });
    </script>
</body>
</html>
