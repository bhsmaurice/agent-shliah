<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Havruta - Beth Habad</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .header h1 { font-size: 24px; margin-bottom: 5px; }
    .header p { font-size: 14px; opacity: 0.9; }
    
    .content {
      padding: 30px;
    }
    
    .section {
      margin-bottom: 30px;
    }
    
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .person-card {
      background: linear-gradient(135deg, #f9f9f9 0%, #f0f0f0 100%);
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }
    
    .person-name {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }
    
    .person-info {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
    
    .person-info strong { color: #333; }
    
    .seances-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .seance-card {
      background: #f9f9f9;
      border-left: 4px solid #667eea;
      border-radius: 8px;
      padding: 15px;
    }
    
    .seance-date {
      font-weight: 600;
      color: #667eea;
      margin-bottom: 5px;
    }
    
    .seance-info {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
    
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .btn-whatsapp {
      background: #25D366;
      color: white;
    }
    
    .btn-whatsapp:hover {
      background: #20ba5a;
      transform: translateY(-2px);
    }
    
    .btn-link {
      background: #667eea;
      color: white;
    }
    
    .btn-link:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    
    .empty-state {
      text-align: center;
      padding: 30px;
      color: #999;
    }
    
    .empty-state svg {
      width: 60px;
      height: 60px;
      margin-bottom: 15px;
      opacity: 0.5;
    }
    
    .alert {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 Ma Havruta</h1>
      <p>Étude Torah en paire</p>
    </div>
    
    <div class="content" id="content">
      <div class="loading">
        <p>⏳ Chargement...</p>
      </div>
    </div>
  </div>
  
  <script>
    const BASE_URL = 'https://agent-shliah-production.up.railway.app';
    const HAVROUTA_ID = new URLSearchParams(window.location.search).get('id');
    
    async function loadHavruta() {
      if (!HAVROUTA_ID) {
        document.getElementById('content').innerHTML = `
          <div class="alert error">❌ ID de havruta manquant</div>
        `;
        return;
      }
      
      try {
        const res = await fetch(`${BASE_URL}/api/havrouta/${HAVROUTA_ID}`);
        const result = await res.json();
        
        if (!result.ok) {
          document.getElementById('content').innerHTML = `
            <div class="alert error">❌ Havruta non trouvée</div>
          `;
          return;
        }
        
        renderHavruta(result.havrouta, result.seances);
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="alert error">❌ Erreur: ${err.message}</div>
        `;
      }
    }
    
    function renderHavruta(havrouta, seances) {
      const h = havrouta;
      let html = `
        <div class="section">
          <div class="section-title">👥 Paire d'étude</div>
          
          <div class="person-card">
            <div class="person-name">${h.personne1_prenom} ${h.personne1_nom}</div>
            <div class="person-info">
              <strong>Niveau:</strong> ${h.personne1_niveau}<br>
              <strong>Tél:</strong> <a href="tel:${h.personne1_phone}">${h.personne1_phone}</a>
            </div>
          </div>
      `;
      
      if (h.personne2_phone) {
        html += `
          <div class="person-card">
            <div class="person-name">${h.personne2_prenom} ${h.personne2_nom}</div>
            <div class="person-info">
              <strong>Niveau:</strong> ${h.personne2_niveau}<br>
              <strong>Tél:</strong> <a href="tel:${h.personne2_phone}">${h.personne2_phone}</a>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="empty-state" style="padding: 15px; background: #f9f9f9; border-radius: 8px;">
            📌 Étude seule avec un coordinateur
          </div>
        `;
      }
      
      html += `
        <div class="btn-group">
          <a href="https://wa.me/${h.personne1_phone}?text=Bonjour%20${h.personne1_prenom}%20!%20Ma%20Havruta%20continue%20ici%20😊" class="btn btn-whatsapp">💬 Contacter</a>
      `;
      
      if (h.personne2_phone) {
        html += `
          <a href="https://wa.me/${h.personne2_phone}?text=Bonjour%20${h.personne2_prenom}%20!%20Notre%20Havruta%20continue%20ici%20😊" class="btn btn-whatsapp">💬 Contacter</a>
        `;
      }
      
      html += `
        </div>
      </div>
      `;
      
      html += `
        <div class="section">
          <div class="section-title">📅 Séances prévues</div>
      `;
      
      if (seances.length === 0) {
        html += `
          <div class="empty-state">
            <p>Aucune séance planifiée</p>
            <p style="font-size: 12px; margin-top: 10px;">Le coordinateur ajoutera les séances bientôt</p>
          </div>
        `;
      } else {
        html += '<div class="seances-list">';
        seances.forEach(s => {
          const date = new Date(s.date);
          const dateLabel = date.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
          html += `
            <div class="seance-card">
              <div class="seance-date">📅 ${dateLabel}</div>
              <div class="seance-info">
                <strong>⏰ ${s.heure_debut}</strong>${s.heure_fin ? ` - ${s.heure_fin}` : ''}<br>
                <strong>📖 Sujet:</strong> ${s.sujet || 'Non spécifié'}<br>
                ${s.torah_details ? `<strong>📚 Détails:</strong> ${s.torah_details}<br>` : ''}
                ${s.notes ? `<strong>📝 Notes:</strong> ${s.notes}` : ''}
              </div>
            </div>
          `;
        });
        html += '</div>';
      }
      
      html += `
        </div>
        
        <div class="btn-group">
          <button class="btn btn-link" onclick="window.location.href='/'">← Retour</button>
        </div>
      `;
      
      document.getElementById('content').innerHTML = html;
    }
    
    loadHavruta();
  </script>
</body>
</html>
